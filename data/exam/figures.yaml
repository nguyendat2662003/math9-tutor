# Hình / biểu đồ cho các bài trong kho mà đề nói "như hình vẽ", "biểu đồ"...
#
# Khóa là id bài (hoặc context_id của bài nhiều ý — áp cho mọi ý). Server vẽ ra SVG
# (packages/exam/math9_exam/figures.py). Số liệu lấy đúng từ lời đề; hình không được
# thêm thông tin mà đề không có (ví dụ biểu đồ quạt không ghi % của phần "còn lại").
#
# Bài nhắc tới hình mà KHÔNG có mục ở đây sẽ bị loại khỏi đề (test kiểm tra).
#
# kind: bar | line | hist | pie | parabola | construction | svg

bn26-TN1:
  kind: line
  title: Số ô tô qua trạm thu phí trong 1 giờ
  categories: [Xe 4 chỗ, Xe 7 chỗ, Xe 9 chỗ, Xe 16 chỗ trở lên]
  values: [9, 14, 5, 3]
  y_label: Số xe

bn26-TN32:
  kind: hist
  title: Độ dài 50 lá dương xỉ
  categories: ["[10; 20)", "[20; 30)", "[30; 40)", "[40; 50)"]
  values: [16, 36, 28, 20]
  y_label: Tần số tương đối (%)
  x_label: Độ dài (cm)
  unit: "%"

bn26-TN8:
  kind: pie
  title: Học sinh lớp 9 tham gia câu lạc bộ
  labels: [Ngữ văn, Tiếng Anh, Toán]
  values: [25, 30, null]          # null = "còn lại" — đề không cho số này

dhv26-TN13:
  kind: pie
  title: Kết quả học tập của 200 học sinh lớp 9
  labels: [Tốt, Khá, Đạt]
  values: [20, 64, 16]

hcm26-3:
  kind: bar
  title: Thời gian sử dụng điện thoại mỗi ngày
  categories: [1 giờ, 2 giờ, 3 giờ, 4 giờ, 5 giờ]
  values: [12, 28, 30, 20, 10]
  y_label: Số học sinh

bn26-TN7:
  kind: parabola
  a: -1
  points: [[1, -1], [2, -4]]

bn26-TN3:
  kind: construction
  # A trên cung lớn BC (đáp án 45°), góc BOC vuông
  ops:
    - {op: free, name: O}
    - {op: circle_center_radius, name: w, args: [O], params: {radius: 2}}
    - {op: on_object, name: A, args: [w], params: {theta_min: 1.5708, theta_max: 1.5708}}
    - {op: on_object, name: B, args: [w], params: {theta_min: 3.6652, theta_max: 3.6652}}
    - {op: on_object, name: C, args: [w], params: {theta_min: 5.2360, theta_max: 5.2360}}
    - {op: segment, name: OB, args: [O, B]}
    - {op: segment, name: OC, args: [O, C]}
    - {op: segment, name: AB, args: [A, B]}
    - {op: segment, name: AC, args: [A, C]}

hcm26-4:
  kind: svg
  # Mảnh đất: ngang = chiều dài x + 9, dọc = chiều rộng x. Nhà ở góc trên bên phải,
  # cách cạnh trái 15 m, cách cạnh dưới 11 m -> diện tích (x − 6)(x − 11).
  svg: |
    <svg viewBox="0 0 420 270" xmlns="http://www.w3.org/2000/svg" font-family="inherit" font-size="13">
      <rect x="40" y="20" width="340" height="210" fill="#f5f5f4" stroke="#1f2937" stroke-width="1.6"/>
      <rect x="190" y="20" width="190" height="112" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
      <text x="285" y="80" text-anchor="middle" fill="#1e40af">Nhà ở</text>
      <line x1="40" y1="76" x2="190" y2="76" stroke="#6b7280" stroke-dasharray="4 3"/>
      <text x="115" y="70" text-anchor="middle" fill="#374151">15 m</text>
      <line x1="285" y1="132" x2="285" y2="230" stroke="#6b7280" stroke-dasharray="4 3"/>
      <text x="292" y="186" fill="#374151">11 m</text>
      <text x="210" y="252" text-anchor="middle" fill="#111827">x + 9 (m)</text>
      <text x="22" y="130" text-anchor="middle" fill="#111827" transform="rotate(-90 22 130)">x (m)</text>
    </svg>
