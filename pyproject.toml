[project]
name = "math9-tutor"
version = "0.1.0"
description = "Chatbot giải toán lớp 9 bám chương trình Việt Nam"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "sympy>=1.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "mypy"]
ingest = [
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
]

[tool.setuptools.packages.find]
where = [
    "packages/core", "packages/curriculum",
    "packages/geometry", "packages/verifier", "packages/ingest", "packages/methods", "packages/retrieval",
]

[tool.pytest.ini_options]
pythonpath = [
    "packages/core", "packages/curriculum",
    "packages/geometry", "packages/verifier", "packages/ingest", "packages/methods", "packages/retrieval",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
